<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planets Explorador Solar</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1 class="logo">🌌 Planets Explorador Solar</h1>

<div class="menu">
  <button data-planeta="mercury">Mercúrio</button>
  <button data-planeta="venus">Vênus</button>
  <button data-planeta="earth">Terra</button>
  <button data-planeta="mars">Marte</button>
  <button data-planeta="jupiter">Júpiter</button>
  <button data-planeta="saturn">Saturno</button>
  <button data-planeta="uranus">Urano</button>
  <button data-planeta="neptune">Netuno</button>
</div>

<div class="scene">

  <div id="planet" class="planet mercury"></div>

  <div class="info">
    <h2>PLANETA</h2>
    <h1 id="nome">Mercúrio</h1>
    </div>

    <div class="letra">
         <p id="descricao">O planeta mais próximo do Sol.</p>
    </div>
    <br>
    <div class="autor">
      <p>Desenvolvido por: @Fealsi Programação</p>
    </div>

</div>



<script src="script.js"></script>
</body>
</html>
